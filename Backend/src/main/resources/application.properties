# PRODUCTION APPLICATION PROPERTIES

# Application
spring.application.name=lastro
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# DataSource (PostgreSQL)
# Adapte para a URL do seu banco
spring.datasource.url=jdbc:postgresql://localhost:5432/lastro
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:migrations

# HikariCP
spring.datasource.hikari.pool-name=LastroPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1700000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Fortaleza
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=true

# Pagination (Security Limit)
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

# Image storage
app.storage.root=${APP_STORAGE_ROOT:./uploads}
app.storage.public-base-url=${APP_STORAGE_PUBLIC_BASE_URL:http://localhost:8080}
app.storage.max-file-size=5MB
app.storage.max-width=10000
app.storage.max-height=10000
app.storage.max-pixels=40000000
app.storage.cleanup-enabled=true
app.storage.cleanup-grace-period=24h
app.storage.cleanup-delay-ms=86400000
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Logging
logging.level.org.hibernate.sql=warn

# Swagger
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Defesa contra ataque de força bruta
security.bruteforce.enabled=true
security.bruteforce.max-attempts=5
security.bruteforce.window-seconds=300
security.bruteforce.lock-seconds=900
server.forward-headers-strategy=framework

# Jwt
jwt.public.key=classpath:app.pub
jwt.private.key=classpath:app.key
jwt.token.expires.in=3600
# Chave AES (16, 24 ou 32 bytes) codificada em Base64. Sem ela, novos setups MFA são bloqueados.
security.mfa.secret-encryption.key=${SECURITY_MFA_SECRET_ENCRYPTION_KEY:}

# Setup inicial
bootstrap.admin.email=director@director.com
bootstrap.admin.password=director
bootstrap.admin.presentation-name=Diretor

# Mail
app.mail.enabled=true
app.mail.from-name=LASTRO
app.mail.from-address=no-reply@example.com
app.mail.base-url=http://localhost:8080
app.mail.fail-fast=true
app.mail.transport=smtp
app.mail.rate-limit.min-interval-ms=1000
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Redis queue
app.email.queue.enabled=true
app.email.queue.worker-enabled=true
app.email.queue.key-prefix=${spring.application.name}:email
app.email.queue.claim-ttl-seconds=120
app.email.queue.max-attempts=5
app.email.queue.batch-size=10
app.email.queue.poll-delay-ms=2000
app.email.queue.stale-job-requeue-delay-ms=30000
app.email.queue.initial-backoff-seconds=30
app.email.queue.max-backoff-seconds=900
app.email.queue.idempotency-ttl-hours=24
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=5s
spring.data.redis.repositories.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.health.mail.enabled=false
